media:
  input: assets/images/uploads
  output: /assets/images/uploads
  rename: safe
  categories: [image]

content:
  - name: tutorials
    label: Tutoriels
    type: collection
    path: _tutorials
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      fields: [title, category, published]
      sort: title
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: category
        label: Catégorie
        type: select
        required: true
        options:
          values: [Windows, Internet, Bureautique, Sécurité, Dépannage]
      - name: duration
        label: Durée
        type: string
        required: true
        description: "Exemple : 10 min"
      - name: level
        label: Niveau
        type: select
        required: true
        options:
          values: ["Niveau débutant", "Niveau intermédiaire", "Niveau avancé"]
      - name: summary
        label: Résumé
        type: text
        required: true
      - name: published
        label: Publié
        type: boolean
      - name: body
        label: Contenu du tutoriel
        type: rich-text
        required: true

  - name: site_settings
    label: Textes du site
    type: file
    path: _data/site.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: name
        label: Nom du site
        type: string
      - name: tagline
        label: Petite phrase au-dessus du titre
        type: string
      - name: hero_title
        label: Grand titre d'accueil
        type: text
      - name: hero_text
        label: Texte d'accueil
        type: text
      - name: about_title
        label: Titre À propos
        type: string
      - name: about_text_1
        label: À propos, paragraphe 1
        type: text
      - name: about_text_2
        label: À propos, paragraphe 2
        type: text

settings:
  hide: true
  commit:
    templates:
      create: "Création de {path} via la console"
      update: "Mise à jour de {path} via la console"
      delete: "Suppression de {path} via la console"
      rename: "Renommage de {oldPath} vers {newPath} via la console"
